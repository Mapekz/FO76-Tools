# cargo-deny policy for the root workspace's one Cargo.lock. Run from the repo
# root (CI's `deps` job does the same):
#   cargo deny --all-features check

[graph]
# Check every optional feature's tree too, so an advisory reachable only
# through an optional feature is not missed.
all-features = true

[advisories]
version = 2

ignore = []

[licenses]
version = 2

# Everything in the graph is permissive except MPL-2.0. Expressions like
# "MIT OR Apache-2.0 OR LGPL-2.1-or-later" are satisfied by the MIT arm, so
# copyleft arms of OR expressions need no entry here.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # libloading, via napi-sys (the esm-napi addon).
    "ISC",
    "MIT",
    # Reached only via option-ext <- dirs-sys <- dirs. MPL-2.0 copyleft is
    # file-scoped and does not extend to our own sources; these crates are built
    # locally and not redistributed as binaries.
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Our own crates are MIT-licensed (see the repo-root LICENSE file and each
# crate's `license` field) and checked like any dependency — no ignore.
private = { ignore = false }

[bans]
# Duplicate versions are common and usually transitive (currently syn 2 and 3
# coexist, and dirs pulls a Redox-only getrandom 0.2 alongside our 0.4). Worth
# surfacing, not worth failing the build over.
multiple-versions = "warn"
wildcards = "deny"
# Workspace members depend on each other by path; every member is
# `publish = false`, so a path dependency never reaches a registry.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
