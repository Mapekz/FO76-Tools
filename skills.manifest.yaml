schema_version: 1
bundle_name: fo76-agent-skills
canonical_source_root: .claude/skills
format:
  entrypoint: SKILL.md
  optional_sidecar: RULES.md
  frontmatter_fields: [name, description]
  body_format: CommonMark
portability:
  frontmatter_is_metadata: true
  required_subskill_marker: "**REQUIRED SUB-SKILL:**"
  relative_reference_base: skill_directory
  missing_dependency_policy: report_unavailable_and_use_embedded_constraints
  missing_tool_policy: translate_to_host_equivalent_or_report_blocked
skills:
  - name: agent-skill-portability
    path: .claude/skills/agent-skill-portability/SKILL.md
    requires: []
    references: []
  - name: fo76-hud-permissions
