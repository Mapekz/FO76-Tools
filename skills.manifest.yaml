    requires: [fo76-hud-permissions]
    references: [references/research-run.md]
  - name: fo76-hudmodloader
    path: .claude/skills/fo76-hudmodloader/SKILL.md
    requires: []
    references: [references/shared-hudtools.md]
  - name: fo76-scaleform-ui
