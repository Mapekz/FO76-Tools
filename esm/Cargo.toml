[workspace]
members = [".", "bindings/napi"]

[package]
name = "esm"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
# Local tooling — never uploaded to a registry.
publish = false

[features]
server = ["dep:tokio", "dep:axum", "dep:tower-http"]

[lib]
name = "esm"
path = "src/lib.rs"

[[bin]]
name = "esm"
path = "src/bin/cli/main.rs"

[[bin]]
name = "esm-server"
path = "src/bin/server.rs"
required-features = ["server"]

[dependencies]
anyhow = "1"
log = "0.4"
byteorder = "1.5"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
flate2 = "1"
fs2 = "0.4"
getrandom = "0.4"
lz4_flex = "0.14"
memmap2 = "0.9"
rkyv = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
ureq = { version = "3", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["full"], optional = true }
axum = { version = "0.8", optional = true }
tower-http = { version = "0.7", features = ["trace"], optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
ts-rs = "12.0.1"

# Profile used by .github/workflows/release.yml to build the published binaries.
# Kept separate from `release` so the local `cargo build --release` that backs
# ~/.local/bin/esm keeps its symbols and its faster link step.  Applies
# workspace-wide (this file is the workspace root); Cargo ignores [profile] in
# the bindings/napi member.
[profile.dist]
inherits = "release"
strip = true
lto = "thin"
