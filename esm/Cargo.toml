[workspace]
members = [".", "bindings/napi"]

[package]
name = "esm"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
# Local tooling — never uploaded to a registry.
publish = false

[lib]
name = "esm"
path = "src/lib.rs"

[[bin]]
name = "esm"
path = "src/bin/cli/main.rs"

[dependencies]
anyhow = "1"
log = "0.4"
byteorder = "1.5"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
flate2 = "1"
indexmap = "2"
fs2 = "0.4"
getrandom = "0.4"
lz4_flex = "0.14"
memmap2 = "0.9"
rkyv = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "raw_value"] }

# Unix-only: restores SIGPIPE's default disposition in the CLI's main() (see
# src/bin/cli/main.rs) so writes to a closed
# stdout/stderr (piped output closed early, e.g. `esm list ... | head`) kill
# the process via SIGPIPE like a normal Unix tool instead of surfacing as a
# panicking `std::io::Error` from `println!`/`writeln!`. Already present
# transitively (dirs-sys, fs2, getrandom, memmap2); promoted to a direct
# dependency here because the signal call needs `use libc::...` in bin code.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
ts-rs = "12.0.1"

# Profile used by .github/workflows/release.yml to build the published binaries.
# Kept separate from `release` so the local `cargo build --release` that backs
# ~/.local/bin/esm keeps its symbols and its faster link step.  Applies
# workspace-wide (this file is the workspace root); Cargo ignores [profile] in
# the bindings/napi member.
[profile.dist]
inherits = "release"
strip = true
lto = "thin"
