[package]
name = "ba2"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
# Local tooling — never uploaded to a registry.
publish = false

[lib]
name = "ba2"
path = "src/lib.rs"

[[bin]]
name = "ba2"
path = "src/bin/cli.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
lz4_flex = "0.14"
flate2 = "1"
memmap2 = "0.9"
walkdir = "2"
globset = "0.4"
tempfile = "3"

[dev-dependencies]
globset = "0.4"
tempfile = "3"
