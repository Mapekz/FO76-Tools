[package]
name = "ba2"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
# Local tooling — never uploaded to a registry.
publish = false

[lib]
name = "ba2"
path = "src/lib.rs"

[[bin]]
name = "ba2"
path = "src/bin/cli.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
lz4_flex = "0.14"
flate2 = "1"
memmap2 = "0.9"
walkdir = "2"
globset = "0.4"
tempfile = "3"

[dev-dependencies]
globset = "0.4"
tempfile = "3"

# Profile used by .github/workflows/release.yml to build the published binaries.
# Kept separate from `release` so the local `cargo build --release` that backs
# ~/.local/bin/ba2 keeps its symbols and its faster link step.  Mirrors the
# [profile.dist] in esm/Cargo.toml — keep the two in step.
[profile.dist]
inherits = "release"
strip = true
lto = "thin"
