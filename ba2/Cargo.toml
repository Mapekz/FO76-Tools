[package]
name = "ba2"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
# Local tooling — never uploaded to a registry.
publish = false

[lib]
name = "ba2"
path = "src/lib.rs"

[[bin]]
name = "ba2"
path = "src/bin/cli.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The `ba2` binary's own dependencies; the library needs none of them
# (`default-features = false` for library-only use).
cli = ["dep:clap", "dep:walkdir", "dep:libc"]

[lints]
workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
lz4_flex = "0.14"
flate2 = "1"
memmap2 = "0.9"
walkdir = { version = "2", optional = true }
globset = "0.4"
tempfile = "3"

# Unix-only: restores SIGPIPE's default disposition in the CLI binary's
# main() (see src/bin/cli.rs) so writes to a closed stdout/stderr (piped
# output closed early, e.g. `ba2 info archive.ba2 | head`) kill the process
# via SIGPIPE like a normal Unix tool instead of surfacing as a panicking
# `std::io::Error` from `println!`/`writeln!`. Already present transitively
# (memmap2); promoted to a direct dependency here because the signal call
# needs `use libc::...` in bin code.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

# These exercise the `ba2` binary, which only the `cli` feature builds.
[[test]]
name = "sigpipe"
required-features = ["cli"]

[[test]]
name = "doc_drift"
required-features = ["cli"]

[dev-dependencies]
repo-policy = { path = "../repo-policy" }
globset = "0.4"
tempfile = "3"
