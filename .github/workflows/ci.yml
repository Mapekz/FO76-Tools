name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # release.yml runs this whole workflow first and publishes only if it passes.
  workflow_call:

jobs:
  # ── Rust: fmt / clippy / test ──────────────────────────────────────────────
  #
  # One job over the repo-root Cargo workspace (esm, esm-napi, ba2, repo-policy), through
  # the projects' own `just` recipes.  setup-rust-toolchain reads the repo-root
  # rust-toolchain.toml, so CI always matches the pinned local toolchain.
  rust:
    name: rust (fmt / clippy / test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # rustflags: "" prevents the action from injecting its own -D warnings
      # (we pass that flag explicitly per-step so it shows up in the log).
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # Each crate's check: fmt, clippy and tests; esm's adds the generated
      # TypeScript drift guard and the schema formatting check.
      # Game-data integration tests skip silently when their env vars are unset
      # (no #[ignore] attributes anywhere in esm/src or esm/tests):
      #   esm/tests/decode_coverage.rs  — RUST_TEST_ESM
      #   esm/tests/diff.rs             — RUST_TEST_ESM_A and RUST_TEST_ESM_B
      - name: esm
        run: just esm::check

      - name: ba2
        run: just ba2::check

      # Repo-wide documentation policy (repo-policy/): links and cited paths
      # resolve against tracked files; no file names a downstream consumer.
      - name: doc policy
        run: just policy

  # ── Python tooling tests ──────────────────────────────────────────────────
  #
  # Hermetic unittest suites plus lint and typecheck for both Python projects:
  # the patch-notes pipeline (patch-notes/) and esm's schema tooling
  # (esm/tools/: extractor, curve lookup).  Neither needs a pip install or
  # game data.
  #
  # ruff and ty are dev-only tools invoked through uvx and are never imported at
  # runtime, so both stay stdlib-only (no requirements.txt, no lockfile) and the
  # tests still run on a bare python3.  Both are pinned by exact version: ty is a
  # 0.0.x preview, so an unpinned upgrade could turn CI red on its own.  Config
  # lives in each project's pyproject.toml ([tool.ruff] / [tool.ty] only).
  python:
    name: "python (${{ matrix.project }}): tests / ruff / ty"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: patch-notes
            recipe: patch-notes::check
          - project: esm-tools
            recipe: esm::tools-check

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # Installed via pip rather than a setup-uv action so this depends only on
      # the Python toolchain already provisioned above.
      - name: install uv
        run: pip install uv

      - name: tests / ruff / ty
        run: just ${{ matrix.recipe }}

  # ── esm-viewer: lint + format + typecheck + unit tests ────────────────────
  #
  # No Rust toolchain or native-addon build: index.d.ts is git-tracked and the
  # file:../esm/bindings/napi dependency resolves as a plain symlink.
  #
  # oxlint/oxfmt are dev-only tools (see .oxlintrc.json / .oxfmtrc.json), pinned
  # by exact version since oxfmt is still 0.x. src/shared/generated/ is excluded
  # from both -- it's ts-rs output, drift-guarded separately in the rust job above.
  esm-viewer:
    name: esm-viewer (lint / format / typecheck / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esm-viewer

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: install
        run: bun install --frozen-lockfile

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: lint / format / typecheck / test
        run: just check

  # ── N-API binding: build + smoke ──────────────────────────────────────────
  #
  # Builds the native addon (catches Rust↔JS API drift) and runs the smoke test.
  # Without FO76_ESM set, smoke.mjs exits 0 (SKIP), so no game data is required.
  napi:
    name: napi (build + smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esm/bindings/napi

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: install napi cli
        run: bun install --frozen-lockfile

      - name: build (debug)
        run: bun run build:debug

      # index.d.ts is tracked (esm-viewer typechecks against it without building
      # the addon), so the build must not change it.
      - name: check index.d.ts drift
        run: git diff --exit-code -- index.d.ts

      - name: smoke test (skips without FO76_ESM)
        run: bun run test

  # ── Supply chain: advisories / licenses / bans / sources ───────────────────
  #
  # Named `deps`, not `audit` — the `audit` job below is the unrelated
  # TES5Edit schema-parity gate.
  #
  # One policy (deny.toml) over the workspace's one Cargo.lock.  --all-features
  # so an advisory reachable only through an optional feature is covered too.
  deps:
    name: cargo-deny
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The action invokes:
      #   cargo-deny <arguments> <command> <command-arguments>
      # so `--config` and `--all-features` belong in `arguments` — both are
      # global cargo-deny flags and must precede the `check` subcommand.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features --config deny.toml

  # ── Schema parity audit ───────────────────────────────────────────────────
  #
  # audit.py --gate checks schema/fo76.json against the Pascal source in
  # TES5Edit.  That source lives outside this repo, so CI clones it as a
  # sibling (extract.py expects it at ../TES5Edit relative to esm/).
  #
  # schema/fo76.json is generated from the Eckserah FO76 fork (not upstream
  # TES5Edit/TES5Edit) which carries detailed FO76 record definitions.  We pin
  # to an exact commit so Pascal drift can't flip this gate without a deliberate
  # bump here paired with a schema regeneration.
  audit:
    name: schema parity audit (esm)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # hardcoded.py shells out to the esm CLI (same reader as reader.rs), so the
      # drift guard below needs a release build on PATH.  Shares this job with
      # the TES5Edit clone rather than duplicating it in a separate job.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      # Clone the Eckserah FO76 fork — the source schema/fo76.json is generated
      # from — as a sibling of esm/ (the path extract.py hard-codes).  Pinned
      # to an exact commit; bump this together with a schema regeneration when
      # updating the Pascal reference.
      - name: fetch TES5Edit (Pascal truth source)
        run: |
          git clone --no-checkout --filter=blob:none https://github.com/Eckserah/TES5Edit.git TES5Edit
          git -C TES5Edit checkout 80a2c3c67e629f46b9320aca54adc706e58ea76c
        working-directory: .

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # esm's audit recipe: the parity gate, then the schema and hardcoded-forms
      # drift guards (regenerating either must change no committed file; the
      # hardcoded one drives a release build of the esm CLI).
      - name: audit
        run: just esm::audit
